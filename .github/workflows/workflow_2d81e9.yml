name: CI Build
on:
  workflow_dispatch:

  schedule:
    - cron: '6 3,9,15,21 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
